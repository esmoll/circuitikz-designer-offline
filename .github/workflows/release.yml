name: Build & Release

# Builds the Electron app on a Windows runner and attaches the artifacts to a GitHub release.
# Trigger by pushing a tag (v0.8.2) or manually from the Actions tab.
#
# Nothing here needs a Windows machine on the developer side: the workflow itself
# runs `npm run build` (parcel) before `npm run make`, so the packaged app always
# contains a real `dist/`. Skipping that step locally produces an empty application.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v0.8.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer bundle (parcel)
        run: npm run build

      - name: Verify dist is not empty
        shell: pwsh
        run: |
          if (-not (Test-Path dist/index.html)) {
            throw "parcel produced no dist/index.html - refusing to package an empty app"
          }
          $files = Get-ChildItem dist -File -Recurse
          "dist files: $($files.Count), total $([math]::Round((($files | Measure-Object Length -Sum).Sum)/1MB,1)) MB"
          if ($files.Count -lt 10) { throw "dist looks incomplete" }

      - name: Package and make distributables
        run: npm run make

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "out/make/squirrel.windows/x64/*Setup.exe" release/
          Copy-Item "out/make/zip/win32/x64/*.zip" release/
          $files = Get-ChildItem release -File
          if (-not $files) { throw "no artifacts were produced" }
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --generate-notes --title "$env:TAG"
          }
          gh release upload $env:TAG release/* --clobber
          "Release: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"